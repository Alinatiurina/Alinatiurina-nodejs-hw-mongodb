type: object
required:
  - _id
  - name
  - phoneNumber
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'Anna Ivanova'
  phoneNumber:
    description: 'Phone number'
    type: string
    example: '+380961234567'
  email:
    description: 'Email'
    type: string
    example: 'mail@mail.com'
  isFavourite:
    description: 'Is contact favorite'
    type: boolean
    example: true
  contactType:
    description: "Contact's type"
    type: string
    enum: ['work', 'home', 'personal']
    example: 'home'
  poster:
    description: "Link to contact's photo"
    type: string
    example: <https://res.cloudinary.com/uqwgdu/image/upload/photo.png>
